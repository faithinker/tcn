<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TCN 시스템 개요</title>
    <style>
      :root {
        --paper: #fbfaf8;
        --paper-2: #f2f0ec;
        --ink: #17171a;
        --muted: #4a4a52;
        --soft: #7a7a85;
        --rule: #dedbd4;
        --accent: #1f5f4f;
        --accent-tint: #e3efe9;
        --link: #356b82;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      }
      main {
        width: min(1440px, 100%);
        margin: auto;
        padding: 48px 40px 40px;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font:
          600 12px/1 ui-monospace,
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          400 clamp(36px, 5vw, 56px)/1.05 Georgia,
          serif;
      }
      .lede {
        max-width: 760px;
        margin: 16px 0 32px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }
      figure {
        margin: 0;
        overflow-x: auto;
      }
      svg {
        display: block;
        width: 100%;
        min-width: 960px;
        height: auto;
      }
      .zone {
        fill: rgba(23, 23, 26, 0.018);
        stroke: rgba(23, 23, 26, 0.12);
        stroke-width: 0.8;
      }
      .zone-label {
        fill: var(--soft);
        font:
          600 8px ui-monospace,
          monospace;
        letter-spacing: 0.14em;
      }
      .node-name {
        fill: var(--ink);
        font:
          600 16px 'Pretendard Variable',
          'Pretendard',
          'Apple SD Gothic Neo',
          sans-serif;
      }
      .sub {
        fill: var(--muted);
        font:
          400 12px ui-monospace,
          'Apple SD Gothic Neo',
          monospace;
      }
      .tag {
        fill: var(--soft);
        font:
          600 8px ui-monospace,
          monospace;
        letter-spacing: 0.12em;
      }
      .edge-label {
        fill: var(--muted);
        font:
          500 12px ui-monospace,
          'Apple SD Gothic Neo',
          monospace;
        letter-spacing: 0.04em;
      }
      figcaption {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--rule);
        color: var(--muted);
        font:
          12px/1.5 ui-monospace,
          'Apple SD Gothic Neo',
          monospace;
      }
      footer {
        margin-top: 28px;
        color: var(--soft);
        font:
          11px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TCN / Architecture / Simplified</p>
      <h1>한 Worker, 한 데이터 관문</h1>
      <p class="lede">
        공개·관리자 요청은 Astro 라우트로 모이고, Cloudflare Worker의 SSR/API 경계를 지나 도메인
        로직과 단일 바인딩 관문 <code>lib/db</code>로 내려간다.
      </p>

          </g>
          <g>
            <rect

          <line x1="40" y1="660" x2="1240" y2="660" stroke="#dedbd4" />
          <text class="zone-label" x="40" y="684">LEGEND</text>
          <rect x="132" y="672" width="20" height="12" rx="2" fill="#e3efe9" stroke="#1f5f4f" />
          <text class="sub" x="164" y="684">핵심 관문</text>
          <line
            x1="304"
            y1="680"
            x2="340"
            y2="680"
            stroke="#356b82"

          />
          <text class="sub" x="356" y="684">Cloudflare binding I/O</text>
        </svg>
        <figcaption>
          <span>7 nodes · 6 edges</span><span>Audience: executive</span><span>Size: slide-16x9</span
          ><span>Detail: simplified</span>
        </figcaption>
      </figure>
      <footer>Source: architecture-2026-08-13.mmd · Mermaid layout and styling discarded</footer>
    </main>
  </body>
</html>
