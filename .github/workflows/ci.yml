name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  # 브라우저 게이트 — 렌더/오버플로/콘솔에러 + 라우트 계약(301·404) + 접근성.
  # `run` 잡과 병렬. 로컬 D1(.wrangler/state)에 마이그레이션·시드를 넣고 dev 서버를 띄운다.
  browser-gates:
    name: Browser Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare local D1
        run: |
          ./node_modules/.bin/wrangler d1 migrations apply tcn-content --local
          node scripts/seed-seminar-posts.mjs

      # dev 서버는 데몬으로 떠서 스텝이 끝나면 사라질 수 있다 — 기동·검증을 한 스텝에 묶는다.
      - name: Render, contract, and accessibility gates
        run: |
          set -euo pipefail
          # 더미 시크릿: 게이트가 인증 경로를 밟아도 죽지 않게 한다.
          # LOGIN_CHALLENGE=off 는 localhost 요청에만 로그인 챌린지를 끈다(헤드리스 브라우저는 Turnstile 을 못 통과한다).
          printf 'SESSION_SECRET=%s\nLOGIN_CHALLENGE=off\nMEMBER_FEATURES_ENABLED=true\nSIGNUP_ENABLED=true\nAUTH_MAIL_MODE=local\n' "$(openssl rand -hex 32)" > .dev.vars
          npm run build
          ./node_modules/.bin/wrangler dev --port 4321 --local > /tmp/tcn-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:4321/; then echo "dev server ready (${i}s)"; break; fi
            if [ "$i" -eq 60 ]; then echo "::error::dev server did not become ready"; cat /tmp/tcn-dev.log; exit 1; fi
            sleep 1
          done
          npm run verify
          npm run verify:founding-media
          npm run a11y
          TCN_SEED_BROWSER_MEDIA=1 node scripts/seed-seminar-posts.mjs
          npm run verify:seminar-carousel
          npm run verify:admin
          npm run verify:forum-users
          BASE_URL=http://localhost:4321 TCN_D1_PERSIST_TO=.wrangler/state npm run verify:account
          npm run verify:header

      - name: Upload verify screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-screenshots
          path: verify/
          retention-days: 7
          if-no-files-found: ignore

  run:
    name: CI Run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar의 신규 코드 판정·blame은 전체 히스토리를 요구한다(shallow clone이면 경고 후 부정확).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm run audit

      - name: Apply migrations to local D1
        run: ./node_modules/.bin/wrangler d1 migrations apply tcn-content --local

      - name: Verify Q&A D1 constraints
        run: npm run test:qna:d1

      - name: Verify user role migration
        run: npm run test:roles:d1

      - name: Verify Forum and user management on workerd D1
        run: npm run test:forum:d1 && npm run test:users:d1 && npm run test:account:d1

      - name: Test
        run: npm run test

      - name: Check Astro and TypeScript
        run: npm run check

      # Sonar CI 분석. Test 다음에 둬야 coverage/lcov.info 가 있다.
      # SONAR_TOKEN 시크릿 등록과 SonarCloud Automatic Analysis 끄기가 끝나기 전에는 건너뛴다.
      # 토큰은 이 두 스텝에만 노출한다(잡 전역 env 로 두면 npm 스텝도 읽는다).
      - name: Detect Sonar token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SONAR_TOKEN 미설정 — SonarCloud CI 분석을 건너뜁니다.'
          fi

      - name: SonarCloud scan
        if: steps.sonar.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Workers Static Assets가 _redirects/_headers를 실제로 파싱하는지 PR에서 검증한다.
      - name: Build production Worker
        run: npm run build

      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Dependabot PR 은 알림 시크릿이 없어, 시크릿이 있을 때만 알림을 보낸다.
      - name: Detect notification secrets
        id: notify
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_TO" ]; then
            echo 'telegram=true' >> "$GITHUB_OUTPUT"
          else
            echo 'telegram=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Telegram 시크릿 미설정 — 알림을 건너뜁니다.'
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            echo 'discord=true' >> "$GITHUB_OUTPUT"
          else
            echo 'discord=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Discord 웹훅 미설정 — 알림을 건너뜁니다.'
          fi

      - name: Telegram
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        if: always() && steps.notify.outputs.telegram == 'true'
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔍 TCN CI Job Finished!
            Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            PR: #${{ github.event.pull_request.number }}
            Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: always() && steps.notify.outputs.discord == 'true'
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: 'TCN CI Workflow Status'

  # 워크플로 보안 정적 분석: 권한 과다, 템플릿 인젝션, 고정되지 않은 의존성, 캐시 오염을 PR 에서 잡는다.
  # annotations 모드는 SARIF 업로드(security-events: write)를 쓰지 않으므로 권한이 contents: read 로 유지된다.
  # zizmor 버전은 로컬(`brew install zizmor`)과 같게 고정한다. 올릴 때 두 곳을 함께 바꾼다.
  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
