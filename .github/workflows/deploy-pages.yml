name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      post_id:
        description: Published post UUID whose deployment state should be tracked
        required: false
        type: string
      source_revision:
        description: Published source revision for audit logs
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Check Korean and English content
        run: npm run i18n

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tcn --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record successful content deployment
        if: success() && inputs.post_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEPLOYMENT_POST_ID: ${{ inputs.post_id }}
          DEPLOYMENT_STATUS: deployed
        run: node scripts/publishing/record-deployment.mjs

      - name: Record failed content deployment
        if: failure() && inputs.post_id != ''
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEPLOYMENT_POST_ID: ${{ inputs.post_id }}
          DEPLOYMENT_STATUS: failed
          DEPLOYMENT_ERROR: GitHub Actions build or Cloudflare Pages deployment failed
        run: node scripts/publishing/record-deployment.mjs
