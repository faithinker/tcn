name: Deploy Cloudflare Workers

# 8단계: SSR(Astro on Workers) 단일 배포. 콘텐츠는 D1 실시간 조회라
# 글 발행에는 재배포가 필요 없다 — 이 워크플로는 코드 변경 시에만 돈다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tcn.faithinker12.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcn.faithinker12.workers.dev

    steps:
      - name: Require main for manual production deployments
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm run audit

      - name: Apply migrations to local D1
        run: ./node_modules/.bin/wrangler d1 migrations apply tcn-content --local

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Time Travel bookmark는 migration 직전 복구 지점을 남긴다.
      - name: Capture pre-migration D1 bookmark
        run: |
          ./node_modules/.bin/wrangler d1 time-travel info tcn-content --json | tee d1-bookmark-before.json
          echo "### D1 pre-migration bookmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat d1-bookmark-before.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 이 저장소의 운영 migration은 기존 Worker와 호환되는 additive 변경만 허용한다.
      - name: Apply remote D1 migrations
        run: ./node_modules/.bin/wrangler d1 migrations apply tcn-content --remote

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Production smoke tests
        id: smoke
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/"
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/api/health"
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/api/ready"

      - name: Record deployed version
        run: ./node_modules/.bin/wrangler deployments status >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back Worker after failed smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          ./node_modules/.bin/wrangler rollback --yes --message "Automatic rollback: production smoke test failed"
          echo "Worker rolled back automatically because the production smoke test failed." >> "$GITHUB_STEP_SUMMARY"
