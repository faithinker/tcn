name: Deploy Cloudflare Workers

# 8단계: Astro on Workers 단일 배포. 상세 페이지·API는 D1 실시간 조회(SSR)지만, 홈·세미나
# 목록·소개 페이지는 빌드 때 운영 D1 내용으로 구워진 정적 에셋이다(Worker 호출 0).
# 그래서 세미나가 바뀌면 재배포가 필요하다 — refresh-static-content 워크플로가 10분마다
# 지문을 비교해 이 워크플로를 workflow_dispatch로 다시 돌린다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tcn.faithinker12.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://tcn.faithinker12.workers.dev

    steps:
      - name: Require main for manual production deployments
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm run audit

      - name: Apply migrations to local D1
        run: ./node_modules/.bin/wrangler d1 migrations apply tcn-content --local

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Test
        run: npm test

      # TCN_REQUIRE_CONTENT=1: 빌드 직전 운영 D1에서 세미나 목록을 내보내지 못하면 빌드를
      # 실패시킨다. 빈 목록이나 로컬 DB 내용으로 정적 페이지가 나가는 사고를 막는다.
      - name: Build
        env:
          TCN_REQUIRE_CONTENT: '1'
        run: npm run build

      # Time Travel bookmark는 migration 직전 복구 지점을 남긴다.
      - name: Capture pre-migration D1 bookmark
        run: |
          ./node_modules/.bin/wrangler d1 time-travel info tcn-content --json | tee d1-bookmark-before.json
          echo "### D1 pre-migration bookmark" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat d1-bookmark-before.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 이 저장소의 운영 migration은 기존 Worker와 호환되는 additive 변경만 허용한다.
      - name: Apply remote D1 migrations
        run: ./node_modules/.bin/wrangler d1 migrations apply tcn-content --remote

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # 트래픽 전환은 즉시가 아니므로, 스모크 전에 방금 올린 버전이 100% 트래픽을 받는지 확인한다.
      # 값은 env 로 넘겨 셸 주입을 막는다.
      - name: Wait for the deployed version to serve traffic
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          expected="$(printf '%s' "$DEPLOY_OUTPUT" | grep -oiE 'current version id: *[0-9a-f-]{36}' | tail -1 | grep -oE '[0-9a-f-]{36}' || true)"
          if [ -z "$expected" ]; then
            echo "::error::wrangler deploy output carried no version id — cannot prove what is live"
            exit 1
          fi
          echo "deployed version: $expected"
          for attempt in $(seq 1 12); do
            # 일시적 API 오류는 루프가 흡수한다 — 여기서 죽으면 재시도 자체가 사라진다.
            live="$(./node_modules/.bin/wrangler deployments status --json |
              jq -r '[.versions[] | select(.percentage == 100) | .version_id] | first // ""' || true)"
            if [ "$live" = "$expected" ]; then
              echo "live after ${attempt} attempt(s): $live"
              echo "Smoke tested version: \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: live=${live:-none}"
            sleep 5
          done
          echo "::error::deployed version $expected never reached 100% of traffic"
          exit 1

      - name: Production smoke tests
        id: smoke
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/"
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/api/health"
          curl --fail --silent --show-error --output /dev/null --retry 6 --retry-delay 5 "$PRODUCTION_URL/api/ready"

      - name: Record deployed version
        run: ./node_modules/.bin/wrangler deployments status >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back Worker after failed smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          ./node_modules/.bin/wrangler rollback --yes --message "Automatic rollback: production smoke test failed"
          echo "Worker rolled back automatically because the production smoke test failed." >> "$GITHUB_STEP_SUMMARY"
