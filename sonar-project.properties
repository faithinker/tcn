sonar.projectKey=faithinker_tcn
sonar.organization=faithinker

# 분석 대상은 src 하나. 구 Cloudflare Pages 시절의 functions/ 는 D1 전환 때 삭제됐다.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# sources 가 src 뿐이라 대부분은 이미 대상 밖이지만, 범위가 넓어질 때를 대비해 남긴다.
sonar.exclusions=node_modules/**,dist/**,verify/**,scripts/**,coverage/**,.astro/**,.wrangler/**,.claude/**,public/**,**/*.config.*

# vitest(v8)가 만드는 리포트. 이 파일은 CI 분석에서만 읽힌다 —
# SonarCloud Automatic Analysis 는 properties 를 무시하므로 커버리지가 0%로 표시된다.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# DOM event scripts are exercised by Playwright browser gates and intentionally excluded from Vitest LCOV.
sonar.coverage.exclusions=src/scripts/**

sonar.sourceEncoding=UTF-8
