sonar.projectKey=faithinker_tcn
sonar.organization=faithinker

# 분석 대상은 src 하나.
sonar.sources=src
sonar.tests=src
# src/test-support/** 는 테스트만 쓰는 하네스다(예: node:sqlite 로 마이그레이션을 적용해
# 주는 d1.ts). 파일명이 *.test.ts 가 아니어서 기본값으로는 프로덕션 소스로 잡히고,
# vitest 커버리지 include 밖이라 신규 코드 커버리지를 0%로 끌어내린다.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/test-support/**

# sources 가 src 뿐이라 대부분은 이미 대상 밖이지만, 범위가 넓어질 때를 대비해 남긴다.
sonar.exclusions=node_modules/**,dist/**,verify/**,scripts/**,coverage/**,.astro/**,.wrangler/**,.claude/**,public/**,**/*.config.*

# vitest(v8)가 만드는 리포트. 이 파일은 CI 분석에서만 읽힌다 —
# SonarCloud Automatic Analysis 는 properties 를 무시하므로 커버리지가 0%로 표시된다.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# DOM event scripts are exercised by Playwright browser gates and intentionally excluded from Vitest LCOV.
# The admin React islands are the same case: `npm run verify:admin` drives them in a real browser against
# D1 and R2, and every piece of logic they own is extracted into sibling .ts modules that ARE unit-tested
# and stay measured (readiness, media-order, pending-media, publish-state, editor-messages).
# process-image.ts is browser-only (canvas, createImageBitmap) so Vitest excludes it too — keep this list
# in step with the coverage.exclude list in vitest.config.ts, or Sonar counts a file Vitest never reports.
sonar.coverage.exclusions=src/scripts/**,src/components/admin/**/*.tsx,src/lib/media/process-image.ts

sonar.sourceEncoding=UTF-8
